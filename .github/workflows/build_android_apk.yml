name: Build SpotiPars Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_android_apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Native Android Project via Flutter
        working-directory: mobile
        run: |
          mkdir -p /tmp/backup_manifest
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml
          if [ -d "android/app/src/main/res/mipmap-hdpi" ]; then
            cp -r android/app/src/main/res /tmp/backup_manifest/
          fi
          rm -rf android
          flutter create . --platforms=android --org com.vbif228 --project-name spotipars
          cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -d "/tmp/backup_manifest/res" ]; then
            cp -r /tmp/backup_manifest/res/* android/app/src/main/res/
          fi

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiPars-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
