name: spotipars
description: "A fast, modern Spotify to MP3/FLAC music downloader for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Reactive State Management
  flutter_riverpod: ^2.5.1

  # YouTube audio extraction engine
  youtube_explode_dart: ^2.2.0

  # Network & metadata fetching
  http: ^1.2.1

  # Native Android 'Share' menu intent interceptor
  receive_sharing_intent: ^1.4.8

  # Foreground Service for downloads while screen is off
  flutter_foreground_task: ^6.1.1

  # Filesystem & storage
  path_provider: ^2.1.3
  path: ^1.9.0

  # Runtime permissions handler
  permission_handler: ^11.3.1

  # Icons & UI styling
  flutter_feather_icons: ^2.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
