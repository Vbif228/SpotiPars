name: Build SpotiPars Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_android_apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Native Android Project via Flutter
        working-directory: mobile
        run: |
          mkdir -p /tmp/backup_manifest
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml
          if [ -d "android/app/src/main/res/mipmap-hdpi" ]; then
            cp -r android/app/src/main/res /tmp/backup_manifest/
          fi
          rm -rf android
          flutter create . --platforms=android --org com.vbif228 --project-name spotipars
          cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -d "/tmp/backup_manifest/res" ]; then
            cp -r /tmp/backup_manifest/res/* android/app/src/main/res/
          fi
          python3 -c "
          import glob, re
          for p in glob.glob('android/app/build.gradle*'):
              with open(p, 'r') as f: c = f.read()
              c = re.sub(r'compileSdk(Version)?\s*=?\s*[\w.]+', 'compileSdk = 37', c)
              with open(p, 'w') as f: f.write(c)
          "
          echo "=== Updated compileSdk in build.gradle: ==="
          grep -E "compileSdk" android/app/build.gradle* || true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare Clean Standalone APK
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk SpotiPars.apk

      - name: Publish Direct SpotiPars.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "SpotiPars Mobile (Android) Latest Release"
          body: |
            ## 📱 SpotiPars Mobile (Android)
            
            Прямая загрузка готового APK для смартфона без архивов:
            - ⬇️ **[Скачать SpotiPars.apk](https://github.com/Vbif228/SpotiPars/releases/download/latest/SpotiPars.apk)**
          files: SpotiPars.apk
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiPars-Android-APK
          path: SpotiPars.apk
          if-no-files-found: error
          retention-days: 30
